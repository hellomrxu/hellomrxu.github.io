<script>
'use strict';

const GROUPS=[
 {name:'提车前',emoji:'①',short:'提前准备',sub:'10月27—30日 · 不到店也可以做',goal:'把VIN、价格、合同和周六能办的手续提前确认，避免现场被催促。',tips:'建议在周五晚完成本阶段；销售如果只说“车到了”，务必追问具体VIN及车辆是否绑定订单。',groups:[
  {title:'销售与车辆',items:[
   ['索取17位VIN，并确认车辆已分配给我的订单','请销售发送VIN，并保留聊天记录。','high'],
   ['确认车型全称、动力版本、配置、外观色、内饰色与选装','大唐的具体版本以你的购车合同为准。','high'],
   ['确认车辆制造年月、到店日期','如车龄较长，追问库存维护和轮胎/蓄电池状态。'],
   ['确认PDI交付前检查是否完成','要求交付时说明检测结论及异常处理情况。','high'],
   ['确定周六10:30到店交车及交付联系人','让销售明确交付专员姓名与联系电话。']
  ]},
  {title:'合同与预算',items:[
   ['核对购车合同、定金凭证及提车期限','查清逾期规则与验车、付款、交付顺序。','high'],
   ['索取成交费用清单：车价、定金、税、保险、上牌、服务费','区分裸车价、落地价，不要重复计算已包含项目。','high'],
   ['确认优惠、补贴、置换、赠品和权益的兑现条件','特别核实开票日、上牌地、交付时间等限制。'],
   ['确认付款账户与银行卡/转账单笔限额','收款方与合同相符，不向陌生个人账户转账。','high'],
   ['确认是否需要购车指标与办理材料','如在深圳上牌，提前核验适用的指标及资格要求。']
  ]},
  {title:'保险与随身用品',items:[
   ['提前询价交强险、车损、第三者责任险等','问清是否强制捆绑，重点看保险生效时刻。'],
   ['确认周六临牌/正式号牌办理能力及方式','没有合法有效牌照不驶离上路。','high'],
   ['携带身份证、驾驶证、合同、定金付款凭证','其他材料按上牌地和门店要求准备。'],
   ['手机充满电，带银行卡、充电线、手电筒、干净软布','最好一人验车、一人听交付讲解。'],
   ['确认门店提供充足电量/适当燃油，以及钥匙随车物品','依实际纯电/插混版本核对。']
  ]}
 ]},
 {name:'到店核车',emoji:'②',short:'核对身份',sub:'建议 10:30—11:00',goal:'确认面前的就是合同约定的车；核对准确后再进入细致验车。',tips:'先看车、看证件，不急着付款、开票后确认无误或签“验收合格”。如门店流程不同，先取得明确的异常处理约定。',groups:[
  {title:'车证一致',items:[
   ['查看前风挡VIN并与合同/销售发送VIN核对','17位字符相同；VIN应合法且没有I/O/Q。','high'],
   ['查看车身铭牌的VIN与出厂年月','需要时让工作人员协助找到车身打刻位置。','high'],
   ['核对合格证/电子车辆信息及拟开发票VIN','车型、VIN、购车人信息必须与实际一致。','high'],
   ['核对具体配置、内外饰配色、轮毂、座椅等','同名车不同配置可能差异很大。','high'],
   ['索要PDI检查结果，询问整备/维修/喷漆/更换件情况','对含糊之处记录并要求解释。','high'],
   ['拍摄全车四周、VIN、铭牌、仪表里程和电量','照片建议保存在手机相册并做好命名。']
  ]}
 ]},
 {name:'外观底盘',emoji:'③',short:'车身验收',sub:'建议 11:00—11:40',goal:'在光线好的位置完成车漆、玻璃、轮胎、底盘重点核验。',tips:'尽量把车开到自然光下。发现明显剐蹭/喷漆/结构损伤迹象应暂停交付，先留证据。',groups:[
  {title:'车漆与覆盖件',items:[
   ['绕车一周，在不同角度看车漆色差、划痕、凹陷','注意门把手、前后杠、边角和车顶。','high'],
   ['核对车门、机盖、尾门接缝与开合','观察明显不均匀的缝隙和异响。'],
   ['检查前后保险杠、翼子板、侧裙、后视镜、饰条','注意松动、缺件和安装错位。'],
   ['检查风挡、侧窗、后窗、天窗是否有裂痕、伤点','小碎裂也要拍照确认。','high'],
   ['检查车灯外壳、雾灯区域有无进水/裂纹/破损','存在安全隐患时暂停。'],
   ['检查车底护板、动力电池底部可见区域有无擦碰、凹陷、渗漏','不钻车底，让交付人员配合查看。','high']

  {title:'轮胎与车门',items:[

   ['查看轮胎制造周数、鼓包、割伤与明显异常磨损','非同批次轮胎可询问解释，不以单一日期断定故障。'],
   ['检查四只轮毂有无磕碰、划伤和裂纹','尤其注意轮毂外沿。'],
   ['查看仪表胎压数据及故障提示','交付前要求胎压调整到车辆建议值。'],
   ['测试四门、尾门、机盖锁扣和密封条','开合顺畅、无夹杂和破损。']
  ]}
 ]},
 {name:'内饰车机',emoji:'④',short:'内饰功能',sub:'建议 11:40—12:20',goal:'确认一家人日常使用的座椅、空调、车机和安全装备没有明显问题。',tips:'逐项按你合同中实际配置验证；没有购买的配置可标记“不适用”。',groups:[
  {title:'座椅与安全',items:[
   ['检查前中后排座椅、缝线、门板、仪表台无破损','注意第三排及后备箱内饰。'],
   ['逐个测试已配备的座椅电动调节、折叠、加热、通风','确认动作顺畅，无卡滞。'],
   ['检查安全带卡扣、锁止、儿童锁与儿童安全座椅接口','有孩子乘车尤其重要。','high'],
   ['测试所有车窗、遮阳帘/天窗及防夹功能','避免用手直接测试夹力。'],
   ['检查车内异味、水迹、顶棚、地板和密封','重点注意雨水渗漏痕迹。'],
   ['测试方向盘调节、后视镜调节与电动尾门','仅检查实际配备功能。']
  ]},
  {title:'车机与电气',items:[

function metaFields(){const f=[['dealership','销售门店','例如：××比亚迪王朝店'],['contact','交付联系人','销售/交付专员'],['phone','联系人电话','电话'],['buyer','购车人','发票抬头'],['order','订单编号','订单号'],['city','上牌城市','深圳（可修改）'],['variant','完整车型/版本','大唐 · 具体配置'],['color','车身/内饰颜色','颜色'],['manufactured','制造年月','例如：2026-10'],['vinSales','销售提供VIN','17位'],['vinCar','实车VIN','17位'],['vinDoc','证件VIN','17位'],['mileage','初始行驶里程 km','例如：15'],['soc','交车电量 %','例如：82'],['registration','车牌/临牌信息','例如：临牌有效期、号码'],['handover','约定提车日期与时间','2026-10-31T10:30']];return `<div class="card"><div class="card-body"><h3>车辆与交接信息</h3><p class="small">手机现场填写，数据只保存于当前浏览器。VIN用于核对，不会发送至服务器。</p><div class="metadata-grid">${f.map(([k,label,ph])=>`<div class="field ${['variant','registration'].includes(k)?'wide':''}"><label for="m_${k}">${label}</label><input id="m_${k}" data-meta="${k}" ${k==='handover'?'type="datetime-local"':k.startsWith('vin')?'maxlength="17" style="text-transform:uppercase"':'type="text"'} placeholder="${safe(ph)}" value="${safe(state.meta[k]||'')}"></div>`).join('')}</div><div id="vinStatus" style="margin-top:12px">${vinMsg()}</div></div></div>`}

function feesHtml(){const fs=[['price','合同整车成交价（元）'],['deposit','已付定金（元）'],['tax','实际应缴购置税（元）'],['mandatory','交强险（元）'],['commercial','商业险（元）'],['plate','上牌/代办费（元）'],['service','其他服务费（元）'],['other','其余合同外支出（元）'],['otherPaid','除定金外已支付金额（元）']];return `<div class="card"><div class="card-body"><h3>付款核算器</h3><p class="small">此处是人工输入后的预算辅助计算。若某项已经包含在整车价中，请填0，避免重复计算；实际付款以合同、发票和保险报价为准。</p><div class="metadata-grid">${fs.map(([k,l])=>`<div class="field"><label>${l}</label><input inputmode="decimal" type="number" min="0" step="0.01" data-fee="${k}" value="${safe(state.fees[k])}" placeholder="待确认"></div>`).join('')}</div><div class="money-result" style="margin-top:13px"><div class="small">预计仍需支付合计</div><div class="number" id="feeResult">${feeString()}</div><div class="small" id="feeBreakdown">${feeBrief()}</div></div><div class="alert warn" style="margin-top:10px"><strong>2026购置税提醒</strong>符合条件的新能源乘用车，2026—2027年购置税减半征收，每辆最高减税1.5万元。不能因为销售说“新能源免税”就把税额填0。以发票、车型适用条件和税务机关结果为准。<br><a href="https://hq.mof.gov.cn/tongzhitonggao/202307/t20230704_3894319.htm" target="_blank" rel="noreferrer">财政部政策原文（在线链接）</a></div></div></div>`}

function feeString(){let n=feeCalc();return n===null?'请先输入合同车价':'¥ '+fmtNum(n)}
function feeBrief(){return feeCalc()===null?'完成后自动汇总，未填项目暂按0计算。':'合同车价 − 定金 + 另计税费/保险/服务等 − 其他已付金额；未填项按0计算。'}
function gateHtml(){const list=GATES.map(g=>`<div class="gate"><input type="checkbox" id="gate_${g.id}" data-gate="${g.id}" ${state.gates[g.id]?'checked':''}><label for="gate_${g.id}">${safe(g.name)}<small>${safe(g.tip)}</small></label></div>`).join('');const problems=[];if(!vinMatch())problems.push('三处VIN未确认一致');if(!checksHighComplete())problems.push(`重点核验项仍有 ${TASKS.filter(t=>t.high&&t.stage<=7&&state.checks[t.id]!=='done').length} 项未确认`);if(blockers().length)problems.push(`${blockers().length}项重大异常未解决`);if(!gatesPassed())problems.push(`${GATES.filter(g=>!state.gates[g.id]).length}个交车门禁未通过`);return `<div class="card" id="gatePanel"><div class="card-body"><h3>🔒 最终交车门禁</h3><p class="small">必须亲自确认所有条件，工具才允许记录“交车完成”。勾选仅代表你的人工核验，不会代替官方验收。</p><div class="gates">${list}</div><div id="gateConclusion" style="margin-top:12px">${problems.length?`<div class="alert danger"><strong>暂不满足最终交车条件</strong>${problems.map(s=>'• '+safe(s)).join('<br>')}</div>`:'<div class="alert"><strong>关键门禁已全部通过</strong>请在确认实车和文件后完成最终签收。</div>'}</div><div class="actions" style="margin-top:12px"><button class="btn primary" data-finalize ${overallReady()||state.finalizedAt?'':'disabled'}>${state.finalizedAt?'✓ 已记录交车完成':'确认最终交车完成'}</button>${state.finalizedAt?'<button class="btn warn sm" data-unfinalize>撤销完成记录</button>':''}</div>${state.finalizedAt?`<p class="small">记录时间：${fmtDate(state.finalizedAt)}。如出现新重大异常，请重新核实记录。</p>`:''}</div></div>`}
function introHtml(s){return `<div class="card"><div class="stage-intro"><span class="step-number">第 ${state.stage+1} / ${GROUPS.length} 阶段</span><h2>${s.emoji} ${s.name}</h2><p>${s.sub}</p><div class="alert"><strong>本阶段目标</strong>${s.goal}</div></div><div class="guide"><strong>操作提示：</strong>${s.tips}</div></div>`}
function issuesMini(){let issues=state.issues.filter(i=>i.stage===state.stage).sort((a,b)=>b.created.localeCompare(a.created));return `<div class="card"><div class="card-body"><div class="section-heading" style="margin:0"><h3>本阶段异常与待处理项</h3><button class="btn sm" data-viewissues>全部 ${state.issues.length} 项 →</button></div>${issues.length?issues.map(issueHtml).join(''):'<p class="small">暂无异常。遇到车漆、付款、保险、配置等问题，点底部「＋记录异常」保存问题与处理结果。</p>'}</div></div>`}
function issueHtml(i){return `<div class="issue ${i.severity==='critical'?'critical':''} ${i.resolved?'resolved':''}"><div class="issue-header"><span class="pill ${i.resolved?'green':i.severity==='critical'?'red':''}">${i.resolved?'✓ 已解决':i.severity==='critical'?'⛔ 重大 / 阻断':'待协商 / 记录'}</span><small>${safe(GROUPS[i.stage]?.name||'其他')} · ${new Date(i.created).toLocaleDateString('zh-CN')}</small></div><p><b>${safe(i.title)}</b><br>${safe(i.description||'')}</p>${i.solution?`<p class="small"><b>约定/处理：</b>${safe(i.solution)}</p>`:''}<footer><button class="btn sm" data-resolve="${safe(i.id)}">${i.resolved?'改为未解决':'标记已解决'}</button><button class="btn sm" data-editissue="${safe(i.id)}">编辑</button><button class="btn sm" data-deleteissue="${safe(i.id)}">删除</button></footer></div>`}
function drawStage(){let s=GROUPS[state.stage];drawTabs();drawWarnings();updateHero();const extras=state.stage===0?metaFields():state.stage===1?metaFields():state.stage===5?feesHtml():state.stage===7?gateHtml():'';document.getElementById('stagePane').innerHTML=`${introHtml(s)}${extras}${s.groups.map(g=>{let list=TASKS.filter(t=>t.stage===state.stage&&t.group===s.groups.indexOf(g));return `<div class="card"><div class="group-head"><h3>${safe(g.title)}</h3><span>${list.filter(ready).length} / ${list.length}</span></div>${list.map(taskHtml).join('')}</div>`}).join('')}${issuesMini()}${state.stage===8?'<div class="card"><div class="card-body"><h3>复盘与备份</h3><p class="small">及时导出JSON或文字记录，避免清除浏览器缓存时丢失信息。报告包含部分个人信息，请保管好文件。</p><div class="actions"><button class="btn primary" data-export>导出JSON备份</button><button class="btn" data-report>查看完整报告</button></div></div></div>':''}<p class="navhint">当前阶段 ${counts(state.stage).done} / ${counts(state.stage).total} 项已处理 · 轻触「待核验」即可标为已确认</p>`;document.getElementById('prevBtn').disabled=state.stage===0;document.getElementById('nextBtn').textContent=state.stage===GROUPS.length-1?'查看总结 →':'下一步 →';}
function setStage(i){state.stage=Math.min(GROUPS.length-1,Math.max(0,i));persist();drawStage();window.scrollTo({top:0,behavior:'instant'});document.querySelector('.tab.active')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}
function openDrawer(title,html){document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerContent').innerHTML=html;document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden'}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('open');document.body.style.overflow=''}
function toolsDrawer(){const c=counts();const html=`<div class="overview-stats"><div class="stat"><strong>${c.done}/${c.total}</strong><span>核验进度</span></div><div class="stat"><strong>${state.issues.length}</strong><span>异常总数</span></div><div class="stat"><strong>${blockers().length}</strong><span>未解决重大异常</span></div></div><p class="small">最近记录：${state.updatedAt?fmtDate(state.updatedAt):'尚未保存'}</p><div class="tool-btns"><button class="btn primary" data-export>⬇ 导出JSON备份</button><button class="btn" data-import>⬆ 导入JSON恢复</button><button class="btn" data-txt>⬇ 导出TXT报告</button><button class="btn" data-copy>复制文字报告</button><button class="btn" data-print>打印/另存PDF</button><button class="btn" data-viewissues>查看所有异常</button></div><input type="file" accept="application/json,.json" id="importInput" class="hidden"><div class="alert warn" style="margin-top:14px"><strong>请注意离线数据</strong>勾选和备注只自动保存在当前设备、当前浏览器的本地存储。换浏览器、清除网站数据、某些手机浏览器直接打开本地文件，都可能导致丢失。建议每天及交车结束导出JSON备份到手机“文件”或云盘。JSON含VIN、交易信息，勿随意分享。</div><button class="btn warn" data-reset style="margin-top:12px">重置全部数据（谨慎）</button>`;openDrawer('记录 · 备份 · 导出',html)}
function issueForm(id='',taskId=''){let old=state.issues.find(i=>i.id===id)||{};let t=TASKS.find(x=>x.id===taskId);let stage=old.stage??t?.stage??state.stage;let form=`<form id="issueForm"><div class="metadata-grid"><div class="field"><label>所属阶段</label><select name="stage">${GROUPS.map((g,i)=>`<option value="${i}" ${stage===i?'selected':''}>${safe(g.name)}</option>`).join('')}</select></div><div class="field"><label>影响级别</label><select name="severity"><option value="critical" ${old.severity==='critical'||(!old.severity&&t?.high)?'selected':''}>重大：暂停交车</option><option value="normal" ${old.severity==='normal'||(!old.severity&&!t?.high)?'selected':''}>一般：协商整改</option></select></div><div class="field wide"><label>问题标题</label><input name="title" maxlength="100" required placeholder="例如：后保险杠存在明显划痕" value="${safe(old.title||t?.title||'')}"></div><div class="field wide"><label>问题详情（位置 / 现象 / 时间 / 照片文件名）</label><textarea name="description" placeholder="建议打开手机相机拍照，记录照片在相册中的名称；本HTML不自动上传或保存照片">${safe(old.description||'')}</textarea></div><div class="field wide"><label>销售承诺 / 解决方案 / 整改截止时间</label><textarea name="solution" placeholder="例如：销售确认周一更换饰件，双方微信留痕">${safe(old.solution||'')}</textarea></div></div><div class="actions" style="margin-top:12px"><button type="submit" class="btn primary">${id?'保存修改':'保存异常'}</button><button type="button" class="btn" data-close>取消</button></div></form><div class="alert warn" style="margin-top:12px">重大异常保持“未解决”将阻断最终交车。只有实际核实整改完成、复验合格后再标记解决。照片请在手机相册单独保存，本工具不存照片。</div>`;openDrawer(id?'修改异常':'记录异常 / 问题处理',form);document.getElementById('issueForm').dataset.id=id;}
function allIssuesDrawer(){let issues=[...state.issues].sort((a,b)=>b.created.localeCompare(a.created));openDrawer('全部异常与处理',`<div class="actions"><button class="btn primary" data-addissue>＋ 新建异常</button></div>${issues.length?issues.map(issueHtml).join(''):'<div class="alert" style="margin-top:12px">暂无异常记录。</div>'}`)}
function reportText(){const c=counts(),f=feeCalc();let lines=[`比亚迪大唐提车验收记录`,`约定时间：${state.meta.handover||'2026-10-31T10:30'}`,`导出时间：${new Date().toLocaleString('zh-CN')}`,`交付记录：${state.finalizedAt?'已记录完成 '+fmtDate(state.finalizedAt):'尚未确认最终完成'}`,`门店：${state.meta.dealership||'未填'}  联系人：${state.meta.contact||'未填'}`,`购车人：${state.meta.buyer||'未填'}  订单：${state.meta.order||'未填'}`,`车辆版本：${state.meta.variant||'未填'}  颜色：${state.meta.color||'未填'}`,`VIN 销售：${state.meta.vinSales||'未填'}`,`VIN 实车：${state.meta.vinCar||'未填'}`,`VIN 证件：${state.meta.vinDoc||'未填'}`,`VIN 一致：${vinMatch()?'是':'未核验或不一致'}`,`制造年月：${state.meta.manufactured||'未填'}  里程：${state.meta.mileage||'未填'} km  电量：${state.meta.soc||'未填'}%`,`合计进度：${c.done}/${c.total}（不适用${c.na}）`,`重大未解决异常：${blockers().length}`,`预计剩余支付：${f===null?'未填车价':'¥'+fmtNum(f)}`,``, '=== 各阶段核验项 ==='];GROUPS.forEach((g,si)=>{let k=counts(si);lines.push(`\n【${si+1}.${g.name}】${k.done}/${k.total}`);TASKS.filter(t=>t.stage===si).forEach(t=>{let st=state.checks[t.id];lines.push(`${st==='done'?'[√]':st==='na'?'[不适用]':'[ ]'} ${t.title}`);if(state.notes[t.id])lines.push(`    备注：${state.notes[t.id]}`)})});lines.push('\n=== 最终交车门禁 ===');GATES.forEach(g=>lines.push(`${state.gates[g.id]?'[√]':'[ ]'} ${g.name}`));lines.push('\n=== 异常记录 ===');if(state.issues.length===0)lines.push('无');state.issues.forEach((i,ix)=>{lines.push(`${ix+1}. [${i.resolved?'已解决':'未解决'}][${i.severity==='critical'?'重大':'一般'}] ${i.title}（${GROUPS[i.stage]?.name||'其他'}）`);lines.push(`  详情：${i.description||'无'}；处理：${i.solution||'未填写'}`)});lines.push('\n注：此清单为个人核验记录，不代替官方交车单和合同。');return lines.join('\n')}
function download(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download('大唐提车记录_2026-10-31.json',new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'}));toast('已生成JSON备份，请在手机文件中确认保存')}
function exportTXT(){download('大唐提车检查报告_2026-10-31.txt',new Blob(['\ufeff'+reportText()],{type:'text/plain;charset=utf-8'}));toast('已生成文字报告')}
function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(String(reader.result));if(parsed.version!==DATA_VERSION||typeof parsed.checks!=='object'||!Array.isArray(parsed.issues)||typeof parsed.meta!=='object')throw Error('文件不符合当前格式');if(!confirm('导入将覆盖当前手机上的所有提车进度。确定继续吗？'))return;state=Object.assign(structuredClone(DEFAULT),parsed);persist();closeDrawer();drawStage();toast('恢复成功')}catch(e){alert('导入失败：'+e.message)}};reader.readAsText(file)}
function printReport(){const txt=reportText();document.getElementById('printReport').innerHTML=`<h1>大唐提车核验报告</h1><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-family:Arial,sans-serif;font-size:11px">${safe(txt)}</pre>`;window.print()}
async function copyReport(){const txt=reportText();try{await navigator.clipboard.writeText(txt);toast('已复制完整报告')}catch(e){const area=document.createElement('textarea');area.value=txt;document.body.appendChild(area);area.select();try{document.execCommand('copy');toast('已复制报告')}catch(err){toast('无法自动复制，请使用TXT导出')}area.remove()}}
function markIssue(id,resolved){let x=state.issues.find(i=>i.id===id);if(!x)return;if(resolved&&x.severity==='critical'&&!confirm('重大异常必须在实际整改、复验合格后才能标记已解决。你已经核实了吗？'))return;x.resolved=resolved;x.resolvedAt=resolved?new Date().toISOString():'';if(!resolved)state.finalizedAt='';persist();const isIssueDrawer=document.getElementById('drawer').classList.contains('open')&&document.getElementById('drawerTitle').textContent.includes('全部异常');if(isIssueDrawer)allIssuesDrawer();drawStage();}
function resetAll(){if(!confirm('将清空所有进度、费用和异常记录，无法撤销。建议先导出JSON备份。是否继续？'))return;if(!confirm('再次确认：真的要删除本机所有记录吗？'))return;state=structuredClone(DEFAULT);persist();closeDrawer();drawStage()}
function stageNext(){if(state.stage<GROUPS.length-1){setStage(state.stage+1)}else{toolsDrawer()}}
function onClick(ev){const btn=ev.target.closest('button');if(!btn)return;let d=btn.dataset;if(d.stage!==undefined){setStage(Number(d.stage));return}if(d.check){let t=TASKS.find(t=>t.id===d.check);if(state.finalizedAt&&t?.high)state.finalizedAt='';state.checks[d.check]=state.checks[d.check]==='done'?'todo':'done';persist();drawStage();return}if(d.na){state.checks[d.na]=state.checks[d.na]==='na'?'todo':'na';persist();drawStage();return}if(d.note){noteExpanded[d.note]=!noteExpanded[d.note];drawStage();document.getElementById(d.note)?.scrollIntoView({block:'nearest'});return}if(d.taskissue){issueForm('',d.taskissue);return}if(d.viewissues!==undefined){allIssuesDrawer();return}if(d.addissue!==undefined){issueForm();return}if(d.resolve){let x=state.issues.find(i=>i.id===d.resolve);markIssue(d.resolve,!x?.resolved);return}if(d.editissue){issueForm(d.editissue);return}if(d.deleteissue){if(!confirm('确定删除这条异常记录吗？建议先备份。'))return;state.issues=state.issues.filter(i=>i.id!==d.deleteissue);persist();if(document.getElementById('drawer').classList.contains('open'))allIssuesDrawer();drawStage();return}if(d.finalize!==undefined){if(!overallReady()){toast('存在交车门禁未通过，请先处理');return}if(!confirm('确认车辆、款项、保险、合法牌照和所有重大问题均已核实，且准备完成最终签收？'))return;state.finalizedAt=new Date().toISOString();persist();drawStage();toast('已记录最终交车完成！记得导出JSON备份');return}if(d.unfinalize!==undefined){state.finalizedAt='';persist();drawStage();return}if(d.export!==undefined){exportJSON();return}if(d.txt!==undefined){exportTXT();return}if(d.copy!==undefined){copyReport();return}if(d.print!==undefined){printReport();return}if(d.import!==undefined){document.getElementById('importInput')?.click();return}if(d.report!==undefined){toolsDrawer();return}if(d.reset!==undefined){resetAll();return}if(d.close!==undefined){closeDrawer();return}}
function onInput(ev){let e=ev.target,d=e.dataset;if(d.meta){state.meta[d.meta]=e.value;if(d.meta.startsWith('vin'))state.meta[d.meta]=e.value.toUpperCase().trim();persist();if(d.meta.startsWith('vin')){document.getElementById('vinStatus').innerHTML=vinMsg()}return}if(d.fee){state.fees[d.fee]=e.value;persist();let v=document.getElementById('feeResult');if(v){v.textContent=feeString();document.getElementById('feeBreakdown').textContent=feeBrief()}return}if(d.noteinput){state.notes[d.noteinput]=e.value;persist();return}}
function onChange(ev){const d=ev.target.dataset;if(d.gate){state.gates[d.gate]=ev.target.checked;if(!ev.target.checked)state.finalizedAt='';persist();drawStage();return}if(ev.target.id==='importInput'){importJSON(ev.target.files[0]);return}}
function onSubmit(ev){if(ev.target.id!=='issueForm')return;ev.preventDefault();const f=ev.target,fd=new FormData(f),title=String(fd.get('title')||'').trim();if(!title){toast('请填写问题标题');return}let id=f.dataset.id;let i=id?state.issues.find(x=>x.id===id):null;let now=new Date().toISOString();if(!i){i={id:'issue_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),created:now,resolved:false};state.issues.push(i)}i.stage=Number(fd.get('stage'));i.severity=String(fd.get('severity'));i.title=title;i.description=String(fd.get('description')||'').trim();i.solution=String(fd.get('solution')||'').trim();i.modified=now;if(i.severity==='critical'&&!i.resolved)state.finalizedAt='';persist();closeDrawer();drawStage();toast('异常已保存');}
load();drawStage();document.addEventListener('click',onClick);document.addEventListener('input',onInput);document.addEventListener('change',onChange);document.addEventListener('submit',onSubmit);document.getElementById('prevBtn').addEventListener('click',()=>setStage(state.stage-1));document.getElementById('nextBtn').addEventListener('click',stageNext);document.getElementById('issueBtn').addEventListener('click',()=>issueForm());document.getElementById('openTools').addEventListener('click',toolsDrawer);document.getElementById('closeDrawer').addEventListener('click',closeDrawer);document.getElementById('overlay').addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
</script>
</body>
</html>
